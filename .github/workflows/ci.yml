name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Manifest, contracts, skills, provenance
        run: uv run --quiet --with pyyaml -- python tools/validate.py

      - name: Advisory spine tests (parity with the reference implementation + behaviour)
        run: uv run --quiet --with pytest --with pyyaml -- python -m pytest tests -q

      - name: Working example — MCP end-to-end walkthrough
        run: uv run --script examples/run_walkthrough.py

      - name: Server selftest (install integrity)
        run: uv run --script servers/advisory_core/main.py --selftest

      - name: CLI mode (harnesses without MCP)
        run: |
          uv run --script servers/advisory_core/main.py --call well_control_assess \
            '{"pit_gain_bbl":4,"flow_diff_gpm":12,"gas_units_pct":3.5}' | grep -q '"alert_level": 4'
          uv run --script servers/advisory_core/main.py --list-tools | grep -q well_control_assess
          if uv run --script servers/advisory_core/main.py --call well_control_assess '{}' 2>/dev/null; then
            echo "expected a refusal on an empty payload"; exit 1
          fi
          if uv run --script servers/advisory_core/main.py --call not_a_tool '{}' 2>/dev/null; then
            echo "expected an error on an unknown tool"; exit 1
          fi

      - name: Every answer names the defaults in force
        run: |
          uv run --script servers/advisory_core/main.py --call list_calibration '{}' \
            | grep -q '"must_update_before_site_use": true'
          for call in \
            'compute {"formula":"maasp_psi","arguments":{"max_mud_weight_ppg":14.5,"current_mud_weight_ppg":12,"shoe_tvd_ft":5000}}' \
            'well_control_assess {"pit_gain_bbl":3}'; do
            set -- $call; tool=$1; shift
            uv run --script servers/advisory_core/main.py --call "$tool" "$*" | grep -q '"calibration_note"'
          done

      - name: Audit trail survives an update
        run: |
          # The trail must not be written inside the install folder, which is replaced on upgrade.
          uv run --script servers/advisory_core/main.py --call audit_trace '{"limit":1}' \
            | grep -q '"survives_update": true'
          TMP="$(mktemp -d)"
          ADVISORY_DATA_DIR="$TMP" uv run --script servers/advisory_core/main.py \
            --call audit_append '{"entry":{"probe":"ci"}}' | grep -q "$TMP"

      - name: plugin.json conforms to the published Agent Plugins v1 schema
        run: |
          curl -sS -o /tmp/plugin.schema.json https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
          uv run --quiet --with jsonschema -- python - <<'PY'
          import json, jsonschema
          schema = json.load(open("/tmp/plugin.schema.json"))
          doc = json.load(open("plugin.json"))
          jsonschema.validate(doc, schema)
          print("manifest valid against", schema.get("$id"))
          PY

      - name: mcp.json declares only portable fields
        run: |
          uv run --quiet --with pyyaml -- python - <<'PY'
          import json
          doc = json.load(open("mcp.json"))
          assert set(doc) == {"$schema", "mcpServers"}, set(doc)
          for name, server in doc["mcpServers"].items():
              assert server["type"] in {"stdio", "streamable-http", "sse"}, server["type"]
              if server["type"] == "stdio":
                  assert server["command"], name
          print("mcp.json ok:", ", ".join(doc["mcpServers"]))
          PY
