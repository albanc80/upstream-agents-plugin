# ---------------------------------------------------------------------------
# Safety envelope — engine modules safety/safety_envelope.py + config.py
# A synchronous, pre-execution check that no agent or human may override at runtime.
# Pure and deterministic: no code path bypasses it.
# ---------------------------------------------------------------------------
schema: upstream-agents-plugin/policy/v1
id: safety-envelope

# The engine ships these as DEFAULTS, not site values. See site-defaults.yaml.
site_validated: false

limits:
  mud_weight_window:
    min_ppg: 9.0
    max_ppg: 14.5
    hard_violation: true
    note: "Applied to proposal ECD, falling back to the rig-state ECD."
  equipment:
    max_wob_klbs: 40.0
    max_rpm: 180
    max_standpipe_pressure_psi: 4000.0
    max_torque_ft_lbs: 15000.0
    # AUTHORED, not transcribed: the reference implementation defines no flow ceiling. Set to 500
    # gpm as a default. Still below what many rigs pump, so it can refuse high-rate proposals until
    # replaced with the rig's own ceiling. Listed in authored_limits and in the calibration block.
    max_flow_rate_gpm: 1000.0
    hard_violation: true
  wellbore:
    max_dls_per_100ft: 5.0
    hard_violation: true
  regulatory:
    h2s_alarm_ppm: 10.0
    hard_violation: false
    note: "H2S at or above the alarm halts regardless of proposal content."
  losses:
    # AUTHORED, not transcribed: the packaged contract has no loss threshold, so losses could not
    # escalate with severity. This ladder mirrors the pit-gain thresholds (2 / 5 bbl) and stops at
    # level 3 on purpose: a well losing returns is not shut in, it is treated for losses.
    authored: true
    advisory_bbl: 2.0
    alert_bbl: 5.0
    # A flow deficit with a steady pit is still a loss. Converting gpm to barrels over one minute
    # gives it the same scale as the volume ladder; it is an equivalent, not a measured volume.
    flow_equivalent_gpm_per_bbl: 42.0
    # Class boundaries in bbl/hr. Published classes agree on seepage < 10 and disagree above it.
    seepage_max_bbl_hr: 10.0
    partial_max_bbl_hr: 50.0
  probabilistic:
    min_data_quality_to_act: 0.95
    min_confidence_for_action: 0.75
    max_kick_probability_for_autonomy: 0.60
    hard_violation: false
    note: >
      Probabilistic gates and environmental H2S do not trigger autonomy demotion.
      Only physically unsafe asks do.

order_of_evaluation:
  - h2s_regulatory
  - action_type_gate        # non-parameter-change proposals skip all physical checks
  - confidence_floor
  - kick_probability_ceiling
  - equipment_limits
  - mud_weight_window
  - dogleg_severity
  - channel_data_quality

hard_violation_effect: >
  A hard violation forces the proposing agent to autonomy level 1 immediately
  (FR-154 in the engine) and is recorded on the rejection record.

authored_limits:
  # Values in this file that were authored here rather than transcribed from the reference
  # implementation. They carry no pedigree and need a rig-specific answer before site use.
  - max_flow_rate_gpm
  - losses.advisory_bbl
  - losses.alert_bbl
  - losses.flow_equivalent_gpm_per_bbl
  - losses.seepage_max_bbl_hr
  - losses.partial_max_bbl_hr  # 42 gal/bbl over one minute, to size a flow-only loss

calibration:
  # Industry-average defaults stand in for values that are company-policy decisions. They exist so
  # a choice is visible rather than absent, and every tool that uses them says so in its output.
  # MUST UPDATE before site use; site_validated stays false until they are replaced.
  must_update_before_site_use: true
  defaults:
    pit_gain.kick_tolerance_fraction:
      value: 0.5
      basis: "average: cap the pit gain at half the section kick-tolerance volume"
      update_from: "well-control policy (kick tolerance per section)"
    losses.seepage_max_bbl_hr:
      value: 10.0
      basis: "published classes agree on seepage < 10 bbl/hr"
      update_from: "operator loss-classification standard"
    losses.partial_max_bbl_hr:
      value: 50.0
      basis: "midpoint of the 30 / 50 / 100 bbl/hr figures in circulation"
      update_from: "operator loss-classification standard"
    max_flow_rate_gpm:
      value: 1000.0
      basis: "operator placeholder; not derived from a rig pump schedule"
      update_from: "rig pump schedule — min(pump liner, surface equipment, relief setting) minus margin"
    min_data_quality_to_act:
      value: 0.95
      basis: "unverified: needs per-channel distributions from recorded rig data"
      update_from: "empirical measurement (deferred - no live rig data available yet)"
    mud_weight_window:
      basis: "fixed 9.0-14.5 ppg; correct basis is pore pressure + overbalance to frac gradient - margin"
      update_from: "pore pressure / fracture gradient per section"

channel_parameter_map:
  wob: weight_on_bit
  rpm: rpm
  flow_rate: flow_rate
  torque: torque
  ecd: ecd
  standpipe_pressure: standpipe_pressure
